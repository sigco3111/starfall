    <!--
      CRAWLER + NO-JAVASCRIPT CONTENT.

      The game is one canvas, so without this the page is empty to anything that
      does not run WebGL — which is every search crawler and every reader that
      has scripting off. This is not SEO stuffing: it is the honest text version
      of what the canvas would have shown, and the brief below is the actual
      prompt the project was built from, reproduced verbatim.
    -->
    <noscript>
      <!-- With scripting off the boot overlay never gets dismissed, so it sat
           behind the fallback text and bled its wordmark through it. A style
           block inside noscript is the one place CSS can answer "is JavaScript
           running" without any script to ask. -->
      <style>
        #boot { display: none !important; }
      </style>
      <div id="fallback">
        <h1>스타폴</h1>
        <p class="lede">
          Homeworld 스타일의 우주 규모 실시간 전략 게임이 브라우저에서 실행됩니다. 이 페이지를 플레이하려면 JavaScript와 WebGL&nbsp;2가 필요합니다.
        </p>

        <h2>이 게임은</h2>
        <p>
          스타폴은 TypeScript와
          <a href="https://threejs.org">Three.js</a>로 만든 우주 skirmish RTS입니다. 모든 선체, 텍스처, 행성, 별, 이펙트는 코드로 실시간 생성됩니다 — 빌드 어디에도 이미지 파일이 없습니다. 함선은 인스턴스 메시와 impostor 빌보드로 그려져 수백 함선의 함대도 프레임이 유지되며, 시뮬레이션은 60&nbsp;Hz 고정 스텝으로 풀링된 엔티티 스토어와 공간 해시 위에서 렌더링과 분리되어 실행됩니다.
        </p>

        <h2>특징</h2>
        <ul>
          <li>정찰기부터 2km 모선까지 13종 함선 클래스</li>
          <li>Homeworld 이동 디스크를 이용한 3차원 이동</li>
          <li>편대, 스탠스, 통제 그룹, 함대 명단 바</li>
          <li>생산, 연구, 자원 채집</li>
          <li>절차적 선체 판금, 진영 도색, 손상 및 전투 마모</li>
          <li>충격다이아몬드의 추진 플룸, 곡선 흔적, 이온 창</li>
          <li>교전 강도를 따라가는 스트리밍 스코어</li>
        </ul>

        <h2>만들어진 방식</h2>
        <p>
          Starfall was written by Claude Opus&nbsp;5 driving a multi-agent
          workflow, from the single prompt below. The first run cost roughly
          <strong>&#36;633</strong>: 입력 토큰 68.6k, 출력 4.6M, 캐시 읽기 837.2M, 캐시 쓰기 13.6M. 모든 모델·텍스처·이펙트는 코드가 생성하며 시각 자산을 가져오지 않았습니다.
        </p>

        <h2>원본 프롬프트</h2>
        <p>
          이 프롬프트는
          <a href="https://x.com/mattshumer_" rel="noreferrer noopener">Matt Shumer</a>의
          one-shot AAA 프롬프트를 수정한 것으로, 원문 전체는 다음과 같습니다:
        </p>
        <blockquote>
          <p>
            I want you to build a homeworld style universe scale RTS at the
            level of most recent space RTS games. It should be utterly perfect,
            visually beautiful, stunning in detail, with 
            at AAA quality — from textures to physics to anything you could
            think of, with the sense of massiveness and scale.
          </p>
          <p>
            Fan out sub-agents and have sub-agents tackle each one individually
            so that the game is utterly perfect. You should /loop on each item
            and have a separate sub-agent check it visually to ensure it looks
            triple A. That separate sub-agent should be a really harsh critic,
            and if it doesn't look triple A, it should keep going.
          </p>
          <p>
            Don't stop until each sub-agent is utterly wowed with the quality
            when compared with the actual homeworld game. It should literally
            compare them side by side blind and say which one looks better. Do
            this in ThreeJS. /loop until it's utterly perfect. Fan out
            sub-agents and ultracode.
          </p>
          <p>
            Only need random mode, not mission, create multiple ship types,
            great UI, HUD, and game mechanics, and fluent control, max quality.
          </p>
          <p>
            For ship models, and effects, AAA, max detail needed, use shaders,
            generative textures, and instancing to ensure best performance.
          </p>
        </blockquote>

        <h2>크레딧</h2>

        </p>

        </p>
